name: Update firm insights

# Refreshes data.json from the 11 firms' insight feeds twice daily, and can be
# run on demand from the Actions tab.

on:
  workflow_dispatch: {} # the "Run workflow" button — force a refresh anytime
  schedule:
    # GitHub cron is UTC and cannot express a timezone. Sydney is UTC+10 (AEST)
    # / UTC+11 (AEDT), so these shift by an hour across daylight saving.
    # Three times a day (~every 8h).
    - cron: "0 21 * * *" # ~07:00 Sydney morning (08:00 during AEDT)
    - cron: "0 5 * * *" #  ~15:00 Sydney afternoon (16:00 during AEDT)
    - cron: "0 13 * * *" # ~23:00 Sydney night (00:00 during AEDT)

# Allow the workflow to commit the refreshed data.json back to the repo.
permissions:
  contents: write

# Never let two runs race to commit.
concurrency:
  group: update-insights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Gilbert + Tobin is fetched through a headless Chromium (to pass its
      # Cloudflare challenge), so install that one browser + its OS deps.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape firm insights and rebuild data.json
        run: npm run scrape

      - name: Commit data.json if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to data.json — nothing to commit."
          else
            git commit -m "chore(data): refresh firm insights"
            git push
            echo "Committed and pushed refreshed data.json."
          fi

      # After the commit, so fresh data still deploys. Fails the run (and GitHub
      # emails) when a firm hasn't returned articles for over 7 days.
      - name: Check for firms that have stopped updating
        run: node scripts/check-stale.mjs
